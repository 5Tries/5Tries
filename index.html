<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>5 Tries</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <!-- ======= TOP GAME BAR ======= -->
  <div id="gameTopBar">
    <span class="icon-row">
      <span id="coinIcon" title="Coins">🪙</span>
      <span id="progCoinVal">50</span>
      <span id="attemptIcon" title="Attempts">🔁</span>
      <span id="progAttemptVal">3</span>
      <button id="progRefillBtn">Refill (10)</button>
      <button id="progBuyCoinsBtn">Buy Coins</button>
      <span id="leaderboardIcon" title="Leaderboard">🏆</span>
      <span id="progressIcon" title="My Progress">📊</span>
      <span id="shopIcon" title="Shop">🛒</span>
    </span>
  </div>

  <!-- Username Modal -->
  <div id="usernameModal" style="display:none;position:fixed;inset:0;z-index:2000;align-items:center;justify-content:center;background:rgba(0,0,0,0.7)">
    <div style="background:#fff;padding:2em 1em 1.5em 1em;border-radius:12px;max-width:320px;text-align:center;box-shadow:0 8px 40px #0002">
      <h3 style="margin-bottom:1em;">Enter your Name</h3>
      <input id="usernameInput" type="text" placeholder="Your name" maxlength="12" style="margin-bottom:1em;width:90%;padding:0.5em;font-size:1.1em"/>
      <br>
      <button id="setUsernameBtn" style="padding:0.6em 1.5em;background:goldenrod;border:none;border-radius:7px;color:#fff;font-size:1em;cursor:pointer">OK</button>
    </div>
  </div>

  <!-- 1) LOADING SCREEN -->
  <div id="loadingScreen">
    <div class="loader-bar"><div id="loadingProgress"></div></div>
    <button id="startBtn">Start</button>
  </div>

  <!-- 2) PACK SELECTION (THEME QUEST) -->
  <div id="progressionScreen">
    <div class="progression">
      <h2 class="progression-title">Theme Quest</h2>

      <!-- Starter Pack (10 levels) -->
      <section class="pack starter-pack unlocked">
        <div class="pack-header">Starter Pack</div>
        <div class="levels"></div>
      </section>

      <!-- Nature & Living Things (5 levels) -->
      <section class="pack unlocked">
        <div class="pack-header">Nature &amp; Living Things</div>
        <div class="levels"></div>
      </section>

      <!-- Food & Drinks (5 levels) -->
      <section class="pack unlocked">
        <div class="pack-header">Food &amp; Drinks</div>
        <div class="levels"></div>
      </section>

      <!-- Locked Packs -->
      <section class="pack locked">
        <div class="pack-header">Urban Life <span class="lock">🔒</span></div>
        <div class="levels"></div>
      </section>
      <section class="pack locked">
        <div class="pack-header">World &amp; Travel <span class="lock">🔒</span></div>
        <div class="levels"></div>
      </section>
      <section class="pack locked">
        <div class="pack-header">Art’s &amp; Culture <span class="lock">🔒</span></div>
        <div class="levels"></div>
      </section>
    </div>
  </div>

  <!-- 3) QUEST SELECTION -->
  <div id="questScreen">
    <div class="quest-container">
      <h3>Select a Quest</h3>
      <ul class="quest-list"></ul>
      <button id="backBtn" class="back-btn">← Back</button>
    </div>
  </div>

  <!-- 4) GAME UI -->
  <div id="gameContainer" style="display:none;">
    <div class="container">
      <div class="stats">
        <h1 class="game-title">5🆃🆁🅸🅴🆂</h1>
        <div id="score">🪙 50</div>
        <div id="attempts">🔁🔁🔁</div>
        <button id="backGameBtn" class="back-game-btn">← Back</button>
      </div>
      <!-- Hint button + box under title -->
      <button id="hintBtn" class="hint-btn">!</button>
      <div id="hintBox" class="hint-box" style="display:none;"></div>
      <div class="top-message">
        <div id="message"></div>
        <button id="nextWordBtn" style="display:none;">Next Word</button>
      </div>
      <div id="board"></div>
      <div id="keyboard" class="keyboard"></div>
      <div class="controls">
        <button id="revealLetterBtn">💡 Reveal Letter (5)</button>
        <button id="removeLetterBtn">❌ Remove Letter (3)</button>
        <button id="refillAttemptBtn">🔁 Refill Attempt (10)</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
