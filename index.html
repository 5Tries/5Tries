<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>5Tries</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="header">
    <div class="title-score-wrapper">
      <h1 class="game-title">5🆃🆁🅸🅴🆂</h1>

    </div>
  </div>

  <script src="script.js"></script>
