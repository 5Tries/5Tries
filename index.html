<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>5 Tries</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <!-- LOADING / START OVERLAY -->
  <div id="loadingScreen">
    <div class="loader-bar">
      <div id="loadingProgress"></div>
    </div>
    <button id="startBtn" style="display:none;">Start</button>
  </div>

  <!-- GAME UI (hidden until Start) -->
  <div id="gameContainer" style="display:none;">
    <div class="container">
      <div class="stats">
        <h1 class="game-title">5🆃🆁🅸🅴🆂</h1>
        <div id="score">🪙 50</div>
        <div id="attempts">🔁🔁🔁</div>
      </div>
      <div class="top-message">
        <div id="message"></div>
        <button id="nextWordBtn" style="display:none;">Next Word</button>
      </div>
      <div id="board"></div>
      <div id="keyboard" class="keyboard"></div>
      <div class="controls">
        <button id="revealLetterBtn">💡 Reveal Letter (5)</button>
        <button id="removeLetterBtn">❌ Remove Letter (3)</button>
        <button id="refillAttemptBtn">🔁 Refill Attempt (10)</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
